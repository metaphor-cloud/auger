name: release

on:
  push:
    tags: ["v*"]
  # `cut` calls this after it writes the tag. A tag pushed with GITHUB_TOKEN starts no
  # workflow of its own, which is what stops a release running twice.
  workflow_call:
    inputs:
      version:
        description: The version to release, with no leading v.
        required: true
        type: string

# The release job writes the GitHub release and nothing else.
permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Every tag, so the release can be checked against the ones before it.
          fetch-depth: 0
          # A called run would otherwise take the branch, which moves. The tag does not,
          # so the bundle is built from the commit the tag names and no other.
          ref: ${{ inputs.version && format('refs/tags/v{0}', inputs.version) || github.ref }}

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: extractions/setup-just@dd310ad5a97d8e7b41793f8ef055398d51ad4de6 # v2

      - name: Read the version
        id: version
        env:
          GIVEN: ${{ inputs.version }}
        run: echo "value=${GIVEN:-${GITHUB_REF_NAME#v}}" >> "$GITHUB_OUTPUT"

      # A tag that disagrees with the bundle makes the updater offer the same release
      # for ever, so the build stops here rather than shipping it. The tag name reaches
      # the script through the environment, never the command line: whoever pushes a tag
      # chooses that string, and a tag may hold shell metacharacters.
      - run: ./scripts/check-version.sh "$VERSION"
        env:
          VERSION: ${{ steps.version.outputs.value }}

      # A version that already shipped would build a second, different bundle claiming
      # to be the first, and the updater compares versions, so it could never tell them
      # apart.
      - run: ./scripts/check-release-tag.sh "$VERSION"
        env:
          VERSION: ${{ steps.version.outputs.value }}

      - run: just setup
      - run: just lint
      - run: just typecheck
      - run: just test

      - run: ./scripts/import-certificate.sh
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

      # notarytool reads the key from a file, so the step writes one and puts its path
      # in the environment for `just release`.
      - run: ./scripts/write-api-key.sh
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}

      # APPLE_SIGNING_IDENTITY and APPLE_TEAM_ID are not here. import-certificate.sh
      # reads them out of the certificate and puts them in the environment, so there
      # is no second copy to leave unset.
      - run: just release
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - run: just verify

      - name: Write the updater manifest
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          ./scripts/write-latest-json.py "$VERSION" \
            app/src-tauri/target/release/bundle latest.json

      # The updater reads latest.json from the newest release, so it must be an asset of
      # this one. The .dmg is what a new user downloads.
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            latest.json
            app/src-tauri/target/release/bundle/dmg/*.dmg
            app/src-tauri/target/release/bundle/macos/*.app.tar.gz
            app/src-tauri/target/release/bundle/macos/*.app.tar.gz.sig
