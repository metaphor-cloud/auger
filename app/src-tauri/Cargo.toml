[package]
name = "auger"
version = "0.2.9"
description = "A background code reviewer that keeps your code on your machine"
authors = ["auger contributors"]
license = "Apache-2.0"
edition = "2021"

[lib]
# The `_lib` suffix keeps the library name distinct from the binary name on Windows.
name = "auger_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
base64 = "0.22"
libc = "0.2.189"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-updater = "2.10.1"
