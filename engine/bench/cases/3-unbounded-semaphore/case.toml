title = "a new semaphore per call limits nothing"
tier = 3
tags = ["correctness", "concurrency"]
file = "gateway.py"
lines = [17, 22]
summary = """
Building the semaphore inside `complete` reads as a tidy simplification: the dict of
limits goes away and the value is taken straight from the backend. But a semaphore only
counts the callers that share it, and every call now makes its own, so each one acquires
its own permit immediately and the limit never applies. A hundred concurrent reviews all
reach the server at once, which is the overrun the class exists to prevent.
"""
