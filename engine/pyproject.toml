[project]
name = "reviewrig-engine"
version = "0.1.0"
description = "Background code review engine for reviewrig"
readme = "README.md"
license = "Apache-2.0"
requires-python = "==3.12.*"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pydantic>=2.9",
    "sse-starlette>=2.1",
    "tomlkit>=0.13",
    "pathspec>=0.12",
    "httpx>=0.27",
]

[project.scripts]
reviewrig-engine = "reviewrig.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-timeout>=2.3",
    "mypy>=1.13",
    "ruff>=0.8",
    "pyinstaller>=6.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reviewrig"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# A hung test must fail, not stall the run.
timeout = 30
testpaths = ["tests"]
