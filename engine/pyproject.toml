[project]
name = "auger"
version = "0.2.1"
description = "Background code review engine for auger"
readme = "README.md"
license = "Apache-2.0"
requires-python = "==3.12.*"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pydantic>=2.9",
    "sse-starlette>=2.1",
    "tomlkit>=0.13",
    "pathspec>=0.12",
    "httpx>=0.27",
    # The MCP SDK is built on httpx2, and the rig guards that client too.
    "httpx2>=2.12",
    "psutil>=6.1",
    "tree-sitter>=0.23",
    "tree-sitter-language-pack>=0.4",
    "sqlite-vec>=0.1.6",
    "mcp>=1.2",
]

[project.scripts]
auger = "auger.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-timeout>=2.3",
    "pytest-xdist>=3.6",
    "mypy>=1.13",
    "ruff>=0.8",
    "pyinstaller>=6.11",
    "types-psutil>=6.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/auger"]

[tool.ruff]
extend-exclude = ["bench/cases"]
line-length = 100
src = ["src", "tests", "bench"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF"]

[tool.mypy]
# The defect corpus is code written to be wrong. Checking it would report the very
# faults it exists to hide, and two cases share a module name on purpose.
exclude = ["^bench/cases/"]
strict = true
python_version = "3.12"
files = ["src", "tests", "bench"]

# These ship no type information. The wrappers around them are typed.
[[tool.mypy.overrides]]
module = ["sqlite_vec", "tree_sitter_language_pack"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
# A hung test must fail, not stall the run.
timeout = 30
addopts = "-n auto"
testpaths = ["tests"]
